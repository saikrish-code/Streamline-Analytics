name: Weekly churn model retrain and deploy

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: weekly-churn-model
  cancel-in-progress: false

jobs:
  retrain-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CHURN_TRAINING_DATABASE_URL }}
      CHURN_MODEL_REGISTRY: api/model_registry/churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"
      - name: Train and version model
        id: train
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Set repository secret CHURN_TRAINING_DATABASE_URL to a Postgres URL with current marts." >&2
            exit 1
          fi
          MODEL_VERSION="1.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "model_version=$MODEL_VERSION" >> "$GITHUB_OUTPUT"
          python -m api.churn.train --version "$MODEL_VERSION"
      - name: Normalize container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-churn-api" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish model-baked API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.train.outputs.model_version }}
            ${{ steps.image.outputs.name }}:latest
      - name: Deploy image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ steps.train.outputs.model_version }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Set repository secret RENDER_DEPLOY_HOOK_URL to the churn API Render deploy hook." >&2
            exit 1
          fi
          SEP='?'
          [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]] && SEP='&'
          IMAGE_QUERY="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_REF"], safe=""))')"
          curl --fail-with-body --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${SEP}imgURL=${IMAGE_QUERY}"
