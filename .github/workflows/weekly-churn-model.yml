name: Weekly churn model retrain and deploy

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-churn-model
  cancel-in-progress: false

jobs:
  retrain-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CHURN_TRAINING_DATABASE_URL }}
      CHURN_MODEL_REGISTRY: api/model_registry/churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"
      - name: Train and version model
        id: train
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Set repository secret CHURN_TRAINING_DATABASE_URL to a Postgres URL with current marts." >&2
            exit 1
          fi
          MODEL_VERSION="1.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "model_version=$MODEL_VERSION" >> "$GITHUB_OUTPUT"
          python -m api.churn.train --version "$MODEL_VERSION"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy model-baked API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          MODEL_VERSION: ${{ steps.train.outputs.model_version }}
        shell: bash
        run: |
          for key in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_API_SERVICE_ID; do
            if [[ -z "${!key}" ]]; then echo "Missing GitHub Actions secret: $key" >&2; exit 1; fi
          done
          echo "Deploying churn model ${MODEL_VERSION} to Railway API service"
          railway up --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE_ID" --ci
