name: Data pipeline CI

on:
  pull_request:
    paths:
      - "dbt_project/**"
      - "quality/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - "quality/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"

jobs:
  raw-quality-and-dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: streamline
          POSTGRES_USER: streamline
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamline -d streamline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: streamline
      POSTGRES_USER: streamline
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://streamline:ci_password@localhost:5432/streamline
      STREAMING_FRESHNESS_MINUTES: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion, quality, and dbt dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[quality,dbt]"

      - name: Configure dbt profile
        run: cp dbt_project/profiles.yml.example dbt_project/profiles.yml

      - name: Seed CI raw-zone fixture
        run: python -m quality.seed_ci_raw

      - name: Validate raw zone with Great Expectations
        run: python -m quality.validate_raw

      - name: Build and test dbt models
        if: success()
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project
