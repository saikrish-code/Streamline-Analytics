name: Python unit tests

on:
  pull_request:
    paths:
      - "api/**"
      - "ingestion/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ingestion/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]" pytest
      - name: Run API and ingestion tests
        run: python -m pytest api/tests ingestion/tests -q
