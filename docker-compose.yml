services:
  postgres:
    image: postgres:16
    container_name: streamline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamline}
      POSTGRES_USER: ${POSTGRES_USER:-streamline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamline_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamline} -d ${POSTGRES_DB:-streamline}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
